name: CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for libmagic
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff mypy

      - name: Lint with Ruff
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Type Check with Mypy
        run: |
          mypy app --ignore-missing-imports

      - name: Run Backend Tests with Coverage
        env:
          GEMINI_API_KEY: mock_ci_api_key_12345
          RATE_LIMIT: 100/minute
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=90

  frontend-test:
    name: Frontend Lint & Component Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Component Tests
        run: npm test -- --coverage --watchAll=false
